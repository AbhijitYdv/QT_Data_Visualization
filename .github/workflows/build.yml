name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # let both platforms finish so you see every failure
      matrix:
        include:
          - os: macos-latest
            qt_arch: ""
          - os: windows-latest
            qt_arch: win64_msvc2022_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"          # keep in sync with docs/onboarding.md
          arch: ${{ matrix.qt_arch }}
          cache: true
          # modules: qtcharts qtpositioning   # uncomment once the code uses them

      - name: Set up MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        # Passes while no tests exist; starts enforcing once add_test()/qt_add_test() is used.
        run: ctest --test-dir build --output-on-failure --no-tests=ignore
