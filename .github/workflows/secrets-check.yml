name: Secrets check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    name: Secrets check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block private key files
        run: |
          bad=$(git ls-files | grep -Ei '\.(pem|key|p12|pfx)$' || true)
          if [ -n "$bad" ]; then
            echo "Private key / certificate files are committed:"
            echo "$bad"
            exit 1
          fi

      - name: Scan for leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # If the repo lives under a GitHub *organization*, gitleaks needs a free
          # license key stored as a repo secret named GITLEAKS_LICENSE:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
